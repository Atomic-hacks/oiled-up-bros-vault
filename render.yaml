services:
  - type: web
    name: oiled-up-bros-vault
    runtime: node
    plan: free
    buildCommand: npm ci && npm run db:deploy && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24.20.0
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_RECEIPTS_BUCKET
        value: vault-receipts
      - key: OWNER_EMAIL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_CODE
        sync: false
